<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявка на заміри підлоги та дверей</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #cc0000;
      --dark: #111111;
      --darker: #0a0a0a;
      --card: #1a1a1a;
      --line: #2d2d2d;
      --text: #ffffff;
      --text2: #aaaaaa;
    }

    body {
      background: var(--darker);
      font-family: 'Manrope', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 48px;
    }

    /* ── HERO ── */
    .hero {
      width: 100%;
      max-width: 600px;
      background: linear-gradient(135deg, #0a0a0a 0%, #1c0000 60%, #0a0a0a 100%);
      border-bottom: 3px solid var(--red);
    }

    .hero-inner {
      display: flex;
      align-items: center;
      padding: 20px 20px;
      gap: 16px;
    }

    .hero-logo {
      flex-shrink: 0;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .hero-logo img {
      width: 84px;
      height: 84px;
      object-fit: contain;
    }

    .hero-text { flex: 1; }

    .hero-tag {
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 5px;
    }

    .hero-title {
      font-family: 'Oswald', sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.1;
      text-transform: uppercase;
      color: #fff;
    }

    .hero-title span { color: var(--red); }

    .hero-sub {
      margin-top: 6px;
      font-size: .75rem;
      color: var(--text2);
      letter-spacing: .04em;
    }

    .hero-sub b { color: #ccc; }

    .hero-stripe {
      width: 100%;
      height: 5px;
      background: repeating-linear-gradient(
        -45deg, var(--red) 0, var(--red) 8px, #111 8px, #111 16px
      );
    }



    /* ── FORM ── */
    .form-card {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border: 1px solid #222;
      border-top: none;
      padding: 24px 20px 28px;
    }

    .section-label {
      font-family: 'Oswald', sans-serif;
      font-size: .85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text2);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    /* ── SELECT ── */
    .select-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .select-wrap select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: #111;
      border: 1.5px solid var(--line);
      border-radius: 4px;
      padding: 11px 40px 11px 14px;
      font-family: 'Manrope', sans-serif;
      font-size: .9rem;
      color: #fff;
      cursor: pointer;
      outline: none;
      transition: border-color .15s;
    }

    .select-wrap select:focus { border-color: var(--red); }

    .select-wrap select option {
      background: #1a1a1a;
      color: #fff;
    }

    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--red);
      font-size: 1rem;
      pointer-events: none;
    }

    /* ── FIELDS ── */
    .field-group { margin-bottom: 12px; }

    .field-group label {
      display: block;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 5px;
    }

    .field-group input,
    .field-group textarea {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 4px;
      padding: 10px 14px;
      font-family: 'Manrope', sans-serif;
      font-size: .9rem;
      color: #fff;
      background: #111;
      outline: none;
      transition: border-color .15s;
      resize: vertical;
    }

    .field-group input::placeholder,
    .field-group textarea::placeholder { color: #444; }

    .field-group input:focus,
    .field-group textarea:focus { border-color: var(--red); }

    .phone-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111;
      border: 1.5px solid var(--line);
      border-radius: 4px;
      padding: 0 14px;
      transition: border-color .15s;
    }

    .phone-row:focus-within { border-color: var(--red); }

    .phone-row span { color: var(--red); font-size: 1rem; }

    .phone-row input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 0;
      font-family: 'Manrope', sans-serif;
      font-size: .9rem;
      color: #fff;
      outline: none;
    }

    /* ── SUBMIT ── */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--red);
      color: #fff;
      font-family: 'Oswald', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: .12em;
      text-transform: uppercase;
      transition: background .15s, transform .1s;
      margin-top: 16px;
    }

    .submit-btn:hover { background: #e60000; }
    .submit-btn:active { transform: scale(.98); }

    /* ── FOOTER ── */
    .footer-bar {
      width: 100%;
      max-width: 600px;
      background: var(--red);
      padding: 10px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }

    .footer-bar span {
      font-family: 'Oswald', sans-serif;
      font-size: .75rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: #fff;
    }

    .footer-bar .dot { opacity: .5; }

    /* ── SUCCESS ── */
    .success-msg {
      display: none;
      text-align: center;
      padding: 20px 10px;
    }

    .success-msg .check {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .success-msg p {
      font-family: 'Oswald', sans-serif;
      font-size: 1.1rem;
      color: #fff;
      letter-spacing: .05em;
    }

    .success-msg small {
      color: var(--text2);
      font-size: .82rem;
    }

    @media (max-width: 400px) {
      .hero-title { font-size: 1.2rem; }      .form-card { padding: 18px 14px; }
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-inner">
      <div class="hero-logo">
        <img id="logo" alt="Львівський Дядько">
      </div>
      <div class="hero-text">
        <div class="hero-tag">Компанія «Львівський Дядько»</div>
        <div class="hero-title">Заявка на заміри<br><span>підлоги та дверей</span></div>
        <div class="hero-sub"><b>Безкоштовний виїзд</b> · Продаж · Монтаж</div>
      </div>
    </div>
    <div class="hero-stripe"></div>
  </div>



  <!-- FORM -->
  <div class="form-card">

    <div class="section-label">Тип послуги</div>
    <div class="select-wrap">
      <select id="service">
        <option value="" disabled selected>Оберіть послугу...</option>
        <option value="floor_measure">Замір підлоги</option>
        <option value="baseboard_measure">Замір плінтуса</option>
        <option value="door_measure">Замір дверей</option>
        <option value="door_install">Монтаж дверей</option>
        <option value="floor_install">Монтаж підлоги</option>
        <option value="consult">Консультація</option>
      </select>
    </div>

    <div class="section-label">Контакти</div>

    <div class="field-group">
      <label>Ім'я та прізвище</label>
      <input type="text" id="name" placeholder="Іван Петренко">
    </div>

    <div class="field-group">
      <label>Номер телефону</label>
      <div class="phone-row">
        <span>📞</span>
        <input type="tel" id="phone" placeholder="+38 073 860 68 08">
      </div>
    </div>

    <div class="field-group">
      <label>Адреса об'єкта</label>
      <input type="text" id="address" placeholder="м. Львів, вул. ...">
    </div>

    <div class="field-group">
      <label>Примітки</label>
      <textarea id="notes" rows="3" placeholder="Додаткова інформація..."></textarea>
    </div>

    <button class="submit-btn" onclick="sendForm()">Надіслати заявку</button>

    <div class="success-msg" id="success">
      <div class="check">✅</div>
      <p>Заявку надіслано!</p>
      <small>Ми зв'яжемося з вами найближчим часом</small>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer-bar">
    <span>Швидко</span>
    <span class="dot">•</span>
    <span>Якісно</span>
    <span class="dot">•</span>
    <span>Професійно</span>
  </div>

  const BOT_TOKEN = '8898190513:AAHbYlwVg3jphOg8UpzSZhIR8bSfrSKcTn0';
  const CHAT_ID = '370677048';

  const SERVICE_LABELS = {
    'floor_measure': 'Замір підлоги',
    'baseboard_measure': 'Замір плінтуса',
    'door_measure': 'Замір дверей',
    'door_install': 'Монтаж дверей',
    'floor_install': 'Монтаж підлоги',
    'consult': 'Консультація'
  };

  async function sendForm() {
    const service = document.getElementById('service').value;
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const address = document.getElementById('address').value.trim();
    const notes = document.getElementById('notes').value.trim();

    if (!service) { alert('Оберіть тип послуги'); return; }
    if (!name) { alert('Введіть ім\'я'); return; }
    if (!phone) { alert('Введіть номер телефону'); return; }

    const btn = document.querySelector('.submit-btn');
    btn.textContent = 'Надсилаємо...';
    btn.disabled = true;

    const text =
      `📋 *НОВА ЗАЯВКА*\n` +
      `━━━━━━━━━━━━━━━━\n` +
      `🔧 *Послуга:* ${SERVICE_LABELS[service] || service}\n` +
      `👤 *Ім'я:* ${name}\n` +
      `📞 *Телефон:* ${phone}\n` +
      (address ? `📍 *Адреса:* ${address}\n` : '') +
      (notes ? `💬 *Примітки:* ${notes}\n` : '') +
      `━━━━━━━━━━━━━━━━\n` +
      `🕐 ${new Date().toLocaleString('uk-UA')}`;

    try {
      const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CHAT_ID, text, parse_mode: 'Markdown' })
      });
      const data = await res.json();
      if (data.ok) {
        btn.style.display = 'none';
        document.getElementById('success').style.display = 'block';
        document.getElementById('success').scrollIntoView({ behavior: 'smooth' });
      } else {
        btn.textContent = 'Надіслати заявку';
        btn.disabled = false;
        alert('Помилка відправки. Спробуйте ще раз.');
      }
    } catch (e) {
      btn.textContent = 'Надіслати заявку';
      btn.disabled = false;
      alert('Помилка з\'єднання. Перевірте інтернет.');
    }
  }
