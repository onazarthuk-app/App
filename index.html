<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Заявка на замір або монтаж дверей</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      background:#070707;
      font-family:Arial,Helvetica,sans-serif;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:20px;
    }
    .box{
      width:min(720px,100%);
      background:linear-gradient(180deg,#151515,#090909);
      padding:34px;
      border-radius:24px;
      border:1px solid rgba(225,29,46,.45);
      box-shadow:0 22px 70px rgba(0,0,0,.55);
    }
    .title{
      text-align:center;
      font-size:clamp(32px,5vw,56px);
      line-height:1.05;
      font-weight:900;
      text-transform:uppercase;
      margin-bottom:22px;
    }
    .title span{display:block;color:#e11d2e}
    .field{margin-top:14px}
    input,select,textarea{
      width:100%;
      padding:18px;
      border-radius:14px;
      background:#0b0b0b;
      border:1px solid #333;
      color:#fff;
      font-size:17px;
      outline:none;
    }
    textarea{min-height:120px;resize:vertical}
    input:focus,select:focus,textarea:focus{
      border-color:#e11d2e;
      box-shadow:0 0 0 4px rgba(225,29,46,.14);
    }
    .btn{
      margin-top:18px;
      width:100%;
      padding:18px;
      border:0;
      border-radius:14px;
      background:#e11d2e;
      color:#fff;
      font-weight:900;
      font-size:18px;
      cursor:pointer;
      text-transform:uppercase;
    }
    .status{
      text-align:center;
      margin-top:16px;
      font-weight:800;
      min-height:24px;
    }
    .call{
      position:fixed;
      right:20px;
      bottom:20px;
      width:64px;
      height:64px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:#e11d2e;
      color:#fff;
      text-decoration:none;
      font-size:28px;
      box-shadow:0 14px 34px rgba(225,29,46,.42);
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="title">Заявка<span>на замір або монтаж</span></div>

    <form id="form">
      <div class="field">
        <input name="name" placeholder="Ваше імʼя" required>
      </div>

      <div class="field">
        <input name="phone" placeholder="Телефон" required>
      </div>

      <div class="field">
        <select name="service" required>
          <option value="">Що потрібно?</option>
          <option>Замір дверей</option>
          <option>Монтаж дверей</option>
          <option>Консультація</option>
        </select>
      </div>

      <div class="field">
        <textarea name="message" placeholder="Коментар"></textarea>
      </div>

      <button class="btn" type="submit">Надіслати заявку</button>
      <div id="status" class="status"></div>
    </form>
  </div>

  <a class="call" href="tel:0738606808">☎</a>

  <script>
    const BOT_TOKEN = "ВСТАВ_TOKEN";
    const CHAT_ID = "ВСТАВ_CHAT_ID";

    document.getElementById("form").addEventListener("submit", async function(e) {
      e.preventDefault();

      const f = new FormData(e.target);

      const msg =
        "🚪 Нова заявка\n" +
        "👤 Імʼя: " + f.get("name") + "\n" +
        "📞 Телефон: " + f.get("phone") + "\n" +
        "🛠 Послуга: " + f.get("service") + "\n" +
        "💬 Коментар: " + (f.get("message") || "-");

      const status = document.getElementById("status");
      status.innerHTML = "Відправляємо заявку...";

      try {
        await fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: msg
          })
        });

        status.innerHTML = "✅ Надіслано. Наші менеджери зв’яжуться з вами найближчим часом";
        e.target.reset();
      } catch (error) {
        status.innerHTML = "❌ Помилка відправки. Зателефонуйте: 073 860 68 08";
      }
    });
  </script>
</body>
</html>
