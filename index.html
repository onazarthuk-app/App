<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявка</title><style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}.box{width:min(720px,100%);background:#111;padding:34px;border-radius:24px;border:1px solid rgba(225,29,46,.4)}h1{text-align:center;font-size:clamp(32px,5vw,54px)}h1 span{display:block;color:#e11d2e}input,select,textarea,button{width:100%;margin-top:14px;padding:18px;border-radius:14px;font-size:16px}input,select,textarea{background:#0a0a0a;color:#fff;border:1px solid #333}button{background:#e11d2e;color:#fff;border:0;font-weight:900}.status{text-align:center;margin-top:14px}</style></head><body><div class="box"><h1>Заявка<span>на замір або монтаж</span></h1><form id="f"><input name="name" placeholder="Ваше імʼя" required><input name="phone" placeholder="Телефон" required><input name="address" placeholder="Адреса об'єкта / район" required><select name="service"><option>Замір дверей</option><option>Монтаж дверей</option><option>Консультація</option></select><textarea name="message" placeholder="Коментар"></textarea><button>Надіслати заявку</button><div id="status" class="status"></div></form></div><script>const BOT_TOKEN='ВСТАВ_TOKEN';const CHAT_ID='ВСТАВ_CHAT_ID';f.onsubmit=async(e)=>{e.preventDefault();const d=new FormData(f);const txt=`🚪 Нова заявка\n👤 ${d.get('name')}\n📞 ${d.get('phone')}\n📍 ${d.get('address')}\n🛠 ${d.get('service')}\n💬 ${d.get('message')||'-'}`;try{await fetch('https://api.telegram.org/bot'+BOT_TOKEN+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:CHAT_ID,text:txt})});status.innerHTML='✅ Надіслано. Наші менеджери зв’яжуться з вами найближчим часом';f.reset()}catch{status.innerHTML='❌ Помилка відправки'}};</script></body></html>
