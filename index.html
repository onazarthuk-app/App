<!DOCTYPE html>
<html lang="uk">
<head>
  <img src="banner.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Встановлення дверей Львів</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #070707;
      color: #fff;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      background:
        radial-gradient(circle at 80% 10%, rgba(220, 38, 38, 0.18), transparent 32%),
        linear-gradient(180deg, #050505 0%, #101010 48%, #050505 100%);
    }

    .top-banner {
      width: 100%;
      background: #111;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 55px rgba(0,0,0,0.55);
    }

    .top-banner img {
      width: 100%;
      height: auto;
      display: block;
    }

    .form-section {
      width: min(860px, 92%);
      margin: 0 auto;
      padding: 46px 0 64px;
    }

    .form-card {
      position: relative;
      background:
        linear-gradient(180deg, rgba(20,20,20,0.96), rgba(9,9,9,0.96));
      border: 1px solid rgba(225, 29, 46, 0.42);
      border-radius: 26px;
      padding: clamp(22px, 4vw, 42px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 22px 70px rgba(0,0,0,0.58),
        0 0 36px rgba(225,29,46,0.12);
      overflow: hidden;
    }

    .form-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, transparent 0%, transparent 44%, rgba(225,29,46,0.12) 45%, transparent 58%),
        radial-gradient(circle at top right, rgba(225,29,46,0.12), transparent 30%);
      pointer-events: none;
    }

    .form-inner {
      position: relative;
      z-index: 1;
    }

    .title {
      text-align: center;
      margin-bottom: 30px;
    }

    .title h1 {
      font-size: clamp(32px, 5vw, 54px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .title h1 span {
      color: #e11d2e;
      display: block;
    }

    .decor {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-top: 18px;
      color: #e11d2e;
      font-size: 28px;
      font-weight: 900;
    }

    .decor::before,
    .decor::after {
      content: "";
      display: block;
      width: 120px;
      max-width: 28vw;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    }

    form {
      display: grid;
      gap: 16px;
    }

    .field {
      position: relative;
    }

    .field-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #a9a9a9;
      font-size: 20px;
      pointer-events: none;
    }

    .textarea-icon {
      top: 25px;
      transform: none;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.13);
      background: rgba(0,0,0,0.42);
      color: #fff;
      border-radius: 14px;
      padding: 18px 18px 18px 56px;
      font-size: 18px;
      outline: none;
      transition: 0.2s ease;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.4;
    }

    input::placeholder,
    textarea::placeholder {
      color: #9f9f9f;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #e11d2e;
      box-shadow: 0 0 0 4px rgba(225,29,46,0.16);
      background: rgba(0,0,0,0.62);
    }

    select {
      appearance: none;
      cursor: pointer;
      color: #cfcfcf;
    }

    .btn-submit {
      margin-top: 10px;
      border: 0;
      cursor: pointer;
      min-height: 66px;
      border-radius: 14px;
      background: linear-gradient(135deg, #e11d2e, #ff1f32);
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 14px 34px rgba(225,29,46,0.36);
      transition: 0.2s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 44px rgba(225,29,46,0.46);
    }

    .safe-text {
      text-align: center;
      margin-top: 18px;
      color: #a8a8a8;
      font-size: 15px;
    }

    .status {
      text-align: center;
      margin-top: 14px;
      min-height: 24px;
      font-weight: 800;
    }

    .floating-call {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      background: #e11d2e;
      color: #fff;
      text-decoration: none;
      border-radius: 50%;
      font-size: 26px;
      box-shadow: 0 14px 34px rgba(225,29,46,0.42);
    }

    @media (max-width: 700px) {
      .top-banner {
        overflow: hidden;
      }

      .top-banner img {
        width: 150%;
        max-width: none;
        transform: translateX(-17%);
      }

      .form-section {
        padding-top: 28px;
      }

      .title h1 {
        font-size: 30px;
      }

      input,
      select,
      textarea {
        font-size: 16px;
        padding-top: 16px;
        padding-bottom: 16px;
      }

      .btn-submit {
        font-size: 17px;
        min-height: 60px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-banner">
      <img src="/mnt/data/690668403_122097414051306745_2353937245415425312_n.png" alt="Встановлення дверей Львів" />
    </div>

    <main class="form-section">
      <section class="form-card">
        <div class="form-inner">
          <div class="title">
            <h1>Заявка на замір <span>або монтаж дверей</span></h1>
            <div class="decor">///</div>
          </div>

          <form id="leadForm">
            <div class="field">
              <span class="field-icon">👤</span>
              <input id="name" name="name" type="text" placeholder="Ваше ім’я" required />
            </div>

            <div class="field">
              <span class="field-icon">📞</span>
              <input id="phone" name="phone" type="tel" placeholder="Номер телефону" required />
            </div>

            <div class="field">
              <span class="field-icon">🛠</span>
              <select id="service" name="service" required>
                <option value="">Що потрібно?</option>
                <option>Замір дверей</option>
                <option>Монтаж міжкімнатних дверей</option>
                <option>Монтаж вхідних дверей</option>
                <option>Демонтаж старих дверей</option>
                <option>Консультація</option>
              </select>
            </div>

            <div class="field">
              <span class="field-icon">📍</span>
              <input id="address" name="address" type="text" placeholder="Адреса об’єкта / район" />
            </div>

            <div class="field">
              <span class="field-icon textarea-icon">✎</span>
              <textarea id="message" name="message" placeholder="Коментар (необов’язково)"></textarea>
            </div>

            <button class="btn-submit" type="submit">➤ Надіслати заявку</button>
            <div class="status" id="status"></div>
            <p class="safe-text">🔒 Ваші дані в безпеці та не передаються третім особам</p>
          </form>
        </div>
      </section>
    </main>
  </div>

  <a class="floating-call" href="tel:07386060808" aria-label="Подзвонити">☎</a>

  <script>
    const BOT_TOKEN = "ВСТАВ_СЮДИ_TOKEN_БОТА";
    const CHAT_ID = "ВСТАВ_СЮДИ_CHAT_ID";

    const form = document.getElementById("leadForm");
    const statusBox = document.getElementById("status");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const data = new FormData(form);
      const name = data.get("name").trim();
      const phone = data.get("phone").trim();
      const service = data.get("service");
      const address = data.get("address").trim();
      const message = data.get("message").trim();

      const text = `🚪 Нова заявка з сайту

👤 Ім'я: ${name}
📞 Телефон: ${phone}
🛠 Послуга: ${service}
📍 Адреса/район: ${address || "Не вказано"}
💬 Коментар: ${message || "Без коментаря"}`;

      statusBox.textContent = "Відправляємо заявку...";

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: text
          })
        });

        if (!response.ok) throw new Error("Telegram error");

        statusBox.textContent = "✅ Заявку відправлено. Скоро зв’яжемось!";
        form.reset();
      } catch (error) {
        statusBox.textContent = "❌ Не вийшло відправити. Подзвоніть: 073 860 60 808";
      }
    });
  </script>
</body>
</html>
